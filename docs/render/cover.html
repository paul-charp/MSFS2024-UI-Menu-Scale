<!doctype html>
<!-- flightsim.to cover (1920x1080), same layout as the other paulcharp mods. Rendered by docs/render_cover.py. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0e1218; font-family: "Roboto", sans-serif; }
  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 70% at 75% 38%, rgba(255, 196, 140, 0.55) 0%, rgba(255, 196, 140, 0) 60%),
      linear-gradient(180deg, #34507a 0%, #6f8fb5 36%, #c9b9a6 56%, #8f9278 58%, #5f6650 72%, #3b4234 100%);
  }
  .sky::after { /* distant ridge */
    content: ""; position: absolute; left: -5%; right: -5%; top: 52%; height: 10%;
    background: linear-gradient(180deg, rgba(70, 82, 96, 0.9), rgba(70, 82, 96, 0));
    clip-path: polygon(0 60%, 8% 35%, 17% 55%, 28% 20%, 38% 50%, 47% 30%, 58% 58%, 69% 25%, 80% 48%, 90% 30%, 100% 50%, 100% 100%, 0 100%);
  }
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(8, 11, 16, 0.82) 0%, rgba(8, 11, 16, 0.55) 42%, rgba(8, 11, 16, 0.05) 70%);
  }
  .title { position: absolute; left: 120px; top: 50%; transform: translateY(-50%); color: #f2f5f8; max-width: 680px; }
  h1 { white-space: nowrap; }
  .eyebrow { font: 500 26px/1 "Roboto", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #ffb547; }
  h1 { font: 700 112px/1 "Roboto", sans-serif; margin: 26px 0 30px; letter-spacing: -0.02em; }
  .sub { font: 400 34px/1.35 "Roboto", sans-serif; color: rgba(242, 245, 248, 0.82); }
  .for { margin-top: 44px; font: 500 22px/1 "Roboto", sans-serif; color: rgba(242, 245, 248, 0.6); letter-spacing: 0.04em; }

  .shot {
    position: absolute; right: 100px; top: 207px; width: 960px; height: 540px;
    border-radius: 14px; overflow: hidden;
    background: url("../images/world-map-mod.jpg") center / cover;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.10), 0 30px 80px rgba(0, 0, 0, 0.55);
  }
  .scales { position: absolute; right: 100px; top: 789px; display: flex; gap: 24px; }
  .chip {
    display: inline-flex; align-items: center; gap: 18px; height: 84px; padding: 0 34px; border-radius: 42px;
    background: rgba(14, 18, 24, 0.62); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08);
    font: 500 38px/1 "Roboto", sans-serif; color: rgba(236, 241, 246, 0.92); white-space: nowrap;
  }
  .chip .res { color: rgba(236, 241, 246, 0.55); font-weight: 400; }
  .chip s { color: rgba(236, 241, 246, 0.45); text-decoration-thickness: 3px; }
  .chip .arrow { color: rgba(236, 241, 246, 0.45); }
  .chip b { color: #ffb547; font-weight: 700; }
</style>
<div class="sky"></div>
<div class="shade"></div>
<div class="title">
  <div class="eyebrow">For 4K and 1440p screens</div>
  <h1>UI Menu Scale</h1>
  <div class="sub">Smaller, denser menus. The stock UI, drawn at a scale you choose.</div>
  <div class="for">Microsoft Flight Simulator 2024</div>
</div>
<div class="shot"></div>
<div class="scales">
  <div class="chip"><span class="res">4K</span><s>2x</s><span class="arrow">→</span><b>1.5x</b></div>
  <div class="chip"><span class="res">1440p</span><s>1.33x</s><span class="arrow">→</span><b>1x</b></div>
</div>
